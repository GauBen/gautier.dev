name: Push to git.gautier.dev

on: push

jobs:
  mirror:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: git remote add mirror ${{ secrets.MIRROR_REPO_URL }} # URL with HTTPS crendentials
      # Avoids pushing a `HEAD` branch; --no-deref keeps it from deleting origin/main instead
      - run: git update-ref --no-deref -d refs/remotes/origin/HEAD
      # Only branches and tags: --mirror would also try to delete Forgejo's own refs/pull/*
      - run: git push mirror --force --prune 'refs/remotes/origin/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
